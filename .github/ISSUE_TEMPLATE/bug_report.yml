name: Report a problem
description: Something does not work, or works differently from what the docs say.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please do not include personal data about real people. Use invented examples.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see? Paste the exact command or code and the full error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest example that shows the problem.
      placeholder: |
        1. Install version ...
        2. Run ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the tool or package you are using.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Where are you running it?
      description: For example macOS 15 with Python 3.12, Windows 11, or the name of the AI assistant you used it through.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and did not find this one.
          required: true
        - label: This report contains no personal data about real people.
          required: true
